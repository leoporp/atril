<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Atril</title>
<meta name="description" content="Práctica de piano sin culpa">
<meta name="theme-color" content="#FBF7EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1E1813" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Atril">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<style>
/* Fuentes locales (OFL): se ven igual sin internet */
@font-face { font-family: 'Fraunces'; font-style: normal; font-weight: 600; font-display: swap; src: url(fonts/fraunces-latin-600-normal.woff2) format('woff2'); }
@font-face { font-family: 'Nunito Sans'; font-style: normal; font-weight: 400; font-display: swap; src: url(fonts/nunito-sans-latin-400-normal.woff2) format('woff2'); }
@font-face { font-family: 'Nunito Sans'; font-style: normal; font-weight: 600; font-display: swap; src: url(fonts/nunito-sans-latin-600-normal.woff2) format('woff2'); }
@font-face { font-family: 'Nunito Sans'; font-style: normal; font-weight: 700; font-display: swap; src: url(fonts/nunito-sans-latin-700-normal.woff2) format('woff2'); }
@font-face { font-family: 'Caveat'; font-style: normal; font-weight: 500; font-display: swap; src: url(fonts/caveat-latin-500-normal.woff2) format('woff2'); }
@font-face { font-family: 'Caveat'; font-style: normal; font-weight: 700; font-display: swap; src: url(fonts/caveat-latin-700-normal.woff2) format('woff2'); }

/* Estilo "cuaderno a mano": papel con grano, letra a mano para acentos (nunca para leer párrafos),
   cinta, post-its y círculos de lápiz. En oscuro: "cuaderno de noche" (papel café oscuro, lápiz claro).
   Layout: una columna en celular; en tablet, Hoy se abre en dos columnas (qué tocar | tu atril). */
:root {
  --bg: #FBF7EF; --surface: #FFFFFF; --surface2: #F3ECDF; --fg: #2A211B; --muted: #6B5D51; --line: #ECE2D2;
  --rule: #C9DCEB; --margin: #E8B4A6; --accent: #2F6B3C; --accent-fg: #FFFFFF; --accent-deep: #1F4A28; --accent-soft: #E2EFDF; --accent-ink: #1F4A28;
  --terra: #B5532D; --plum: #6E4A72; --postit: #F8DE7E; --postit-ink: #4A3708; --tape: rgba(156,201,166,.75); --tape2: rgba(232,180,166,.75);
  --rest: #A8957F; --danger: #A23B26; --shadow: 0 2px 0 #EFE6D6, 0 12px 26px rgba(42,33,27,.10);
  --grain: url(img/grain-light.png);
  --serif: 'Fraunces', Georgia, serif; --sans: 'Nunito Sans', 'Segoe UI', system-ui, sans-serif; --hand: 'Caveat', 'Segoe Print', cursive;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #1E1813; --surface: #2A221B; --surface2: #332A22; --fg: #F1E7D8; --muted: #B8A895; --line: #3D3229;
  --rule: #34434E; --margin: #6E3A30; --accent: #8FD39E; --accent-fg: #10261A; --accent-deep: #4F8F5E; --accent-soft: #24382A; --accent-ink: #CDEFD4;
  --terra: #EE9A72; --plum: #D2AEDC; --postit: #D9BE5C; --postit-ink: #2E2405; --tape: rgba(111,166,124,.55); --tape2: rgba(200,120,100,.5);
  --rest: #7D6F60; --danger: #F0A08A; --shadow: 0 2px 0 rgba(0,0,0,.25), 0 14px 28px rgba(0,0,0,.35);
  --grain: url(img/grain-dark.png); color-scheme: dark } }

* { box-sizing: border-box; }
html, body { min-height: 100%; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; background: var(--bg) var(--grain) repeat; color: var(--fg); font-family: var(--sans); font-size: 16px; line-height: 1.45;
  padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body::before { content: ""; position: fixed; top: 0; bottom: 0; left: max(8px, env(safe-area-inset-left, 0px)); width: 2px; background: var(--margin); opacity: .7; pointer-events: none; z-index: 0; }
body.locked { overflow: hidden; }
[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }
h1, h2, h3 { font-family: var(--serif); font-weight: 600; margin: 0; text-wrap: balance; }
h1 { font-size: 30px; line-height: 1.08; }
h2 { font-size: 22px; line-height: 1.2; }
h3 { font-size: 19px; line-height: 1.25; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.hand { font-family: var(--hand); font-weight: 700; }
.eyebrow { font-family: var(--hand); font-weight: 700; font-size: 24px; line-height: 1.1; color: var(--muted); }
.page-title { font-family: var(--hand); font-weight: 700; font-size: 46px; line-height: 1; }
.sec-title { font-family: var(--hand); font-weight: 700; font-size: 32px; line-height: 1.05; }

.app { position: relative; z-index: 1; max-width: 600px; margin: 0 auto; padding-top: calc(18px + env(safe-area-inset-top, 0px)); padding-bottom: calc(120px + env(safe-area-inset-bottom, 0px)); }
#view { display: flex; flex-direction: column; gap: 28px; }
.page-head { display: flex; flex-direction: column; gap: 4px; }
.home, .home .col, .narrow { display: flex; flex-direction: column; gap: 28px; min-width: 0; }

/* Encabezado de Hoy */
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 48px; }
.brand { font-family: var(--hand); font-weight: 700; font-size: 44px; line-height: 1; }
.top-r { display: flex; align-items: center; gap: 2px; font-family: var(--hand); font-weight: 500; font-size: 22px; color: var(--muted); text-align: right; }
.syncbtn { min-width: 44px; min-height: 44px; border: 0; background: none; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; padding: 0; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
.dot.local, .dot.error { background: var(--danger); }
.dot.connecting { background: var(--rest); }
.syncnote { font-size: 14px; color: var(--danger); background: none; border: 0; padding: 0; text-align: left; }
button.syncnote { min-height: 44px; text-decoration: underline; text-decoration-style: wavy; text-underline-offset: 4px; }

/* Hojas de papel, cinta y post-its */
.paper { background: var(--surface); border-radius: 6px; box-shadow: var(--shadow); position: relative; }
.tape::before { content: ""; position: absolute; top: -13px; left: 42%; width: 112px; height: 28px; background: var(--tape); transform: rotate(-3deg); pointer-events: none; }
.tape.t2::before { background: var(--tape2); left: auto; right: 18px; transform: rotate(4deg); width: 84px; }
.postit { background: var(--postit); color: var(--postit-ink); font-family: var(--hand); font-weight: 700; font-size: 23px; line-height: 1.1; padding: 12px 14px; box-shadow: 0 8px 16px rgba(42,33,27,.15); transform: rotate(2deg); overflow-wrap: anywhere; }
.postit small { display: block; font-size: 17px; opacity: .8; }
.circled { position: relative; display: inline-block; font-family: var(--hand); font-weight: 700; font-size: 32px; line-height: 1; padding: 4px 10px; }
.circled svg { position: absolute; inset: -6px -10px; width: calc(100% + 20px); height: calc(100% + 12px); color: var(--terra); overflow: visible; pointer-events: none; }

/* Tarjeta "Hoy te toca" */
.hero { padding: 30px 22px 22px; display: flex; flex-direction: column; gap: 14px; transform: rotate(-.5deg); }
.hero .eyebrow { color: var(--accent); font-size: 28px; }
.hero-title { display: flex; flex-direction: column; gap: 8px; }
.hero-title h1 { font-size: 38px; line-height: 1; overflow-wrap: anywhere; }
.where { display: inline-flex; align-items: center; gap: 10px; font-size: 17px; flex-wrap: wrap; }
.why { font-size: 14px; color: var(--muted); }
.hero .postit { align-self: flex-start; max-width: 100%; margin: 2px 0 4px 4px; }
.todo-peek { font-size: 14px; background: var(--accent-soft); color: var(--accent-ink); border-radius: 12px; padding: 10px 12px; overflow-wrap: anywhere; }
.hero-actions { display: flex; flex-direction: column; gap: 10px; }
.hero-sub { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }

.wood { width: 100%; min-height: 62px; border: 0; border-radius: 16px; background: var(--accent); color: var(--accent-fg);
  font-family: var(--hand); font-weight: 700; font-size: 30px; line-height: 1; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 0 20px;
  box-shadow: 0 4px 0 var(--accent-deep); margin-bottom: 4px; }
.wood:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--accent-deep); }
.wood:disabled { opacity: .7; }
.wood small { font-family: var(--sans); font-size: 15px; font-weight: 700; opacity: .9; font-variant-numeric: tabular-nums; }
.ghost { min-height: 46px; padding: 0 16px; border-radius: 14px; border: 2px dashed var(--rest); background: transparent; font-size: 15px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; }
.textbtn { min-height: 44px; padding: 0 6px; border: 0; background: none; color: var(--accent); font-size: 15px; font-weight: 700; }
.textbtn.muted { color: var(--muted); font-weight: 600; }
.textbtn.hand { font-family: var(--hand); font-size: 25px; font-weight: 700; }

/* Semana: pentagrama dibujado a mano */
.week { display: flex; flex-direction: column; gap: 2px; }
.week-head { display: flex; justify-content: space-between; align-items: baseline; }
.week-tot { font-family: var(--hand); font-weight: 500; font-size: 23px; color: var(--muted); }
.week-tot b { color: var(--fg); font-weight: 700; }
.staff { position: relative; height: 92px; }
.staff .lines { position: absolute; inset: 6px 0 auto 0; width: 100%; height: 56px; color: var(--fg); opacity: .45; }
.cells { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.cell { position: relative; display: flex; flex-direction: column; align-items: center; }
.cell svg { width: 42px; height: 66px; overflow: visible; }
.fig-on { color: var(--accent); }
.fig-rest { color: var(--rest); }
.fig-today { color: var(--terra); }
.cell .min { font-family: var(--hand); font-weight: 700; font-size: 20px; line-height: 1; color: var(--accent); margin-top: -2px; }
.cell .min.today { color: var(--terra); }
.daynames { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); text-align: center; font-family: var(--hand); font-weight: 700; font-size: 22px; color: var(--muted); }
.daynames .today { color: var(--fg); text-decoration: underline wavy var(--terra); text-underline-offset: 3px; }

/* Listas: renglones de cuaderno */
.section { display: flex; flex-direction: column; gap: 12px; }
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.rows { background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 62px, var(--rule) 62px, var(--rule) 64px); background-position: 0 0; }
.row { display: flex; align-items: center; gap: 8px; min-height: 64px; }
.row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 0; background: none; border: 0; text-align: left; padding: 6px 4px 6px 2px; min-height: 62px; justify-content: center; }
.row-main .name { font-size: 17px; font-weight: 700; overflow-wrap: anywhere; line-height: 1.2; }
.row-main .meta { font-family: var(--hand); font-weight: 700; font-size: 21px; line-height: 1.1; color: var(--muted); overflow-wrap: anywhere; }
.row-main .meta.c-grupo { color: var(--terra); }
.row-main .meta.c-mia { color: var(--plum); }
.row-main .meta.c-curso { color: var(--accent); }
.row-end { display: flex; align-items: center; gap: 6px; padding-right: 2px; flex-shrink: 0; }
.playbtn { width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--accent); background: transparent; color: var(--accent); display: inline-flex; align-items: center; justify-content: center; }
.tag { font-family: var(--hand); font-weight: 700; font-size: 19px; padding: 1px 10px; border-radius: 999px; border: 2px solid var(--line); color: var(--muted); white-space: nowrap; }
.tag.green { border-color: var(--accent); color: var(--accent); }
.tag.done { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.rowlink { display: flex; justify-content: space-between; align-items: center; gap: 12px; text-decoration: none; color: var(--postit-ink); min-height: 64px; }
.rowlink.postit { font-size: 25px; padding: 14px 16px; transform: rotate(1.4deg); }
.rowlink .t { display: flex; flex-direction: column; gap: 0; min-width: 0; }
.plainlink { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 64px; padding: 12px 16px; text-decoration: none; color: var(--fg); width: 100%; border: 0; text-align: left; }
.plainlink .t { display: flex; flex-direction: column; gap: 0; min-width: 0; }
.empty { color: var(--muted); font-size: 15px; padding: 16px; }
.plain-empty { font-family: var(--hand); font-weight: 500; font-size: 24px; line-height: 1.15; color: var(--muted); }

/* Controles */
.seg { display: inline-flex; background: var(--surface2); border-radius: 14px; padding: 4px; gap: 4px; align-self: flex-start; max-width: 100%; flex-wrap: wrap; }
.seg button { min-height: 40px; padding: 0 14px; border: 0; border-radius: 10px; background: transparent; font-size: 15px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); font-weight: 700; box-shadow: 0 1px 0 var(--line), 0 2px 6px rgba(0,0,0,.08); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 44px; padding: 0 16px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); font-size: 15px; font-weight: 600; max-width: 100%; overflow-wrap: anywhere; text-align: left; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 700; }
.chip.sm { min-height: 38px; padding: 0 12px; font-size: 14px; }
.chip.add { border-style: dashed; color: var(--muted); background: transparent; }
label.field { display: flex; flex-direction: column; gap: 4px; font-family: var(--hand); font-weight: 700; font-size: 22px; line-height: 1.1; color: var(--muted); }
input[type="text"], input[type="number"], input[type="date"], input[type="url"], input[type="email"], input[type="password"] {
  font-family: var(--sans); min-height: 48px; padding: 0 12px; border-radius: 10px; border: 2px solid var(--line); background: var(--surface); font-size: 17px; width: 100%; min-width: 0; color: var(--fg); }
input:focus { border-color: var(--accent); outline: none; }
input::placeholder { color: var(--rest); }
.inline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.inline > input { flex: 1 1 160px; }
.check { display: flex; align-items: flex-start; gap: 12px; min-height: 44px; padding: 8px 0; font-size: 16px; color: var(--fg); }
.check input { width: 22px; height: 22px; accent-color: var(--accent); flex-shrink: 0; margin: 0; }
.check span { overflow-wrap: anywhere; padding-top: 1px; }
.check.done span { text-decoration: line-through; text-decoration-color: var(--terra); text-decoration-thickness: 2px; color: var(--muted); }
.btn { min-height: 44px; padding: 0 18px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); font-size: 15px; font-weight: 700; }
.btn.solid { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); box-shadow: 0 3px 0 var(--accent-deep); }
.btn.danger { border-color: var(--danger); color: var(--danger); background: transparent; }
.btn.sm { min-height: 38px; padding: 0 14px; font-size: 14px; }
.panel { background: var(--surface); border-radius: 6px; box-shadow: var(--shadow); padding: 18px; display: flex; flex-direction: column; gap: 14px; position: relative; }
.panel.soft { background: var(--postit); color: var(--postit-ink); box-shadow: 0 8px 16px rgba(42,33,27,.15); transform: rotate(-.6deg); }
.panel.soft label.field, .panel.soft .small { color: var(--postit-ink) !important; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.confirm { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 15px; }
.err { color: var(--danger); font-size: 15px; font-weight: 600; }
.x { background: none; border: 0; color: var(--muted); min-width: 44px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 10px; }

/* Semana (vista) */
.wk { display: flex; flex-direction: column; gap: 10px; }
.wk-head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.wk-head h3 { font-family: var(--hand); font-weight: 700; font-size: 30px; }
.wk-head .muted { font-family: var(--hand); font-weight: 500; font-size: 22px; }
.sess { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 14px 16px; border-top: 2px dashed var(--line); }
.sess:first-child { border-top: 0; }
.sess .l1 { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.sess .d { font-size: 14px; color: var(--muted); }
.sess .m { font-family: var(--hand); font-weight: 700; font-size: 30px; line-height: 1; color: var(--accent); }
.sess .body { grid-column: 1 / -1; min-width: 0; font-size: 15px; display: flex; flex-direction: column; gap: 2px; overflow-wrap: anywhere; }
.sess .note { font-family: var(--hand); font-weight: 500; font-size: 22px; line-height: 1.15; }
.sess .confirm { grid-column: 1 / -1; }

/* Navegación */
nav#nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--bg) var(--grain) repeat; border-top: 2px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
nav#nav .in { max-width: 600px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding-block: 6px 8px; }
nav#nav a { min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-family: var(--hand); font-weight: 700; font-size: 21px; line-height: 1; color: var(--muted); text-decoration: none; border-radius: 12px; }
nav#nav a svg { width: 24px; height: 24px; }
nav#nav a[aria-current="page"] { color: var(--accent); }
nav#nav a[aria-current="page"] span { text-decoration: underline wavy; text-underline-offset: 4px; text-decoration-thickness: 1.5px; }

/* Hojas a pantalla completa */
.overlay { position: fixed; inset: 0; z-index: 20; overflow-y: auto; -webkit-overflow-scrolling: touch; background: var(--bg) var(--grain) repeat;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.ov-in { max-width: 600px; margin: 0 auto; min-height: 100%; padding-block: 16px 24px; display: flex; flex-direction: column; gap: 22px; }
.ov-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 48px; }
.backbtn { min-height: 44px; border: 0; background: transparent; color: var(--muted); font-family: var(--hand); font-weight: 700; font-size: 24px; display: inline-flex; align-items: center; gap: 2px; padding: 0 4px 0 0; }
.clock { display: flex; flex-direction: column; align-items: center; gap: 4px; padding-block: 5vh 2vh; }
.clock .time { font-family: var(--serif); font-weight: 600; font-size: clamp(76px, 22vw, 124px); line-height: 1; font-variant-numeric: tabular-nums; }
.clock .time.paused { color: var(--muted); }
.clock #clock-sub { font-family: var(--hand); font-weight: 700; font-size: 26px; }
.focus-card { padding: 26px 18px 18px; display: flex; flex-direction: column; gap: 8px; }
.focus-card h2 { font-size: 26px; overflow-wrap: anywhere; }
.spacer { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }

#toast { position: fixed; left: 50%; transform: translateX(-50%) rotate(-1deg); bottom: calc(92px + env(safe-area-inset-bottom, 0px)); z-index: 30;
  background: var(--postit); color: var(--postit-ink); padding: 10px 18px; border-radius: 4px; box-shadow: 0 8px 16px rgba(42,33,27,.2);
  font-family: var(--hand); font-weight: 700; font-size: 24px; line-height: 1.1; opacity: 0; pointer-events: none; transition: opacity .2s; max-width: calc(100% - 32px); text-align: center; }
#toast.show { opacity: 1; }

/* Celebración al guardar: notitas que suben */
#party { position: fixed; inset: 0; z-index: 29; pointer-events: none; overflow: hidden; }
#party span { position: absolute; bottom: 90px; color: var(--accent); animation: rise 1.9s ease-out forwards; opacity: 0; }
#party span:nth-child(3n) { color: var(--terra); }
#party span:nth-child(3n+1) { color: var(--plum); }
@keyframes rise { 0% { transform: translateY(0) rotate(0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(-58vh) rotate(var(--r, 20deg)); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } .wood:active { transform: none; } #party { display: none; } }

/* Tablet */
@media (min-width: 840px) {
  .app { max-width: 1000px; padding-top: calc(28px + env(safe-area-inset-top, 0px)); padding-bottom: calc(128px + env(safe-area-inset-bottom, 0px)); }

<body>

<div class="app"><main id="view"></main></div>

<nav id="nav" aria-label="Secciones">
  <div class="in">
    <a href="#hoy" data-r="hoy"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M8 6v7M12 6v7M16 6v7"/></svg><span>Hoy</span></a>
    <a href="#repertorio" data-r="repertorio"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg><span>Repertorio</span></a>
    <a href="#cursos" data-r="cursos"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="13" rx="2"/><path d="M10 9l5 2.5-5 2.5z"/><path d="M8 21h8"/></svg><span>Cursos</span></a>
    <a href="#semana" data-r="semana"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Semana</span></a>
  </div>

<section id="ov-session" class="overlay" hidden aria-label="Sesión en curso"></section>
<section id="ov-reg" class="overlay" hidden aria-label="Registrar práctica"></section>
<section id="ov-piece" class="overlay" hidden aria-label="Pieza"></section>
<section id="ov-acct" class="overlay" hidden aria-label="Cuenta y nube"></section>
<div id="toast" role="status" aria-live="polite"></div>
<div id="party" aria-hidden="true"></div>

<script>
'use strict';
/* ---------- utilidades ---------- */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => (window.crypto && crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const pad = (n) => String(n).padStart(2, '0');
const dkey = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const fromKey = (k) => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const todayKey = () => dkey(new Date());
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const monday = (d) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); return addDays(x, -((x.getDay() + 6) % 7)); };
const daysBetween = (a, b) => Math.round((fromKey(b) - fromKey(a)) / 86400000);
const fmt = (d, o) => d.toLocaleDateString('es-CO', o).replace(/\./g, '').replace(/,/g, '');
const clone = (o) => JSON.parse(JSON.stringify(o));
const strip = (o) => { const c = clone(o); delete c.u; return c; };
const safeUrl = (u) => { const s = String(u || '').trim(); if (!s) return ''; const w = /^https?:\/\//i.test(s) ? s : 'https://' + s; try { const x = new URL(w); return /^https?:$/.test(x.protocol) ? x.href : ''; } catch (e) { return ''; } };
/* JSON con llaves ordenadas: Postgres reordena las llaves, así se comparan bien */
function stable(v) {
  if (Array.isArray(v)) return '[' + v.map(stable).join(',') + ']';
  if (v && typeof v === 'object') return '{' + Object.keys(v).sort().filter((k) => v[k] !== undefined).map((k) => JSON.stringify(k) + ':' + stable(v[k])).join(',') + '}';
  return JSON.stringify(v === undefined ? null : v);
}
const DAYS = ['L', 'M', 'M', 'J', 'V', 'S', 'D'];
const COURSES = [{ k: 'piano', name: 'Curso de piano' }, { k: 'armonia', name: 'Curso de armonía' }];
const courseName = (k) => (COURSES.find((c) => c.k === k) || { name: k }).name;
const STATES = [{ k: 'aprendiendo', l: 'Aprendiendo' }, { k: 'puliendo', l: 'Puliendo' }, { k: 'sale', l: 'Ya me sale' }];
const stateLabel = (k) => (STATES.find((s) => s.k === k) || STATES[0]).l;
const EXTRA = [{ k: 'tecnica', l: 'Técnica' }, { k: 'libre', l: 'Improvisar' }];
const TAGNAME = { mias: 'Mis piezas', grupo: 'Con el grupo', piano: 'Curso de piano', armonia: 'Curso de armonía', tecnica: 'Técnica', libre: 'Improvisar' };
const GROUP = 'Santi y Juanma';

/* ---------- estado y guardado ----------
   Todo vive en un solo objeto S, guardado en este aparato (localStorage) y en Supabase (tabla atril_state, un JSON por cuenta).
   Cada pieza y cada registro lleva su hora de cambio (u); lo borrado deja una marca en S.tomb; cada dato de S.meta tiene su hora en S.mu.
   Al sincronizar se juntan los dos lados registro por registro y gana lo más reciente: la tablet y el celular no se pisan. */
const LS = 'atril.v4';
const COLLS = ['sessions', 'pieces'];
const META_KEYS = ['courses', 'active', 'settings', 'group'];
const blankMeta = () => ({ courses: { piano: {}, armonia: {} }, active: null, settings: { goal: 10 }, group: {} });
const blank = () => ({ v: 4, sessions: {}, pieces: {}, meta: blankMeta(), tomb: { sessions: {}, pieces: {} }, mu: {} });
function normalize(p) {
  const o = blank();
  if (!p || typeof p !== 'object') return o;
  for (const c of COLLS) { o[c] = Object.assign({}, p[c] || {}); o.tomb[c] = Object.assign({}, (p.tomb && p.tomb[c]) || {}); }
  o.mu = Object.assign({}, p.mu || {});
  const m = Object.assign(blankMeta(), p.meta || {});
  m.courses = Object.assign({ piano: {}, armonia: {} }, m.courses || {});
  m.settings = Object.assign({ goal: 10 }, m.settings || {});
  m.group = m.group || {};
  if (m.active === undefined) m.active = null;
  o.meta = m;
  return o;
}
function mergeStates(a, b) {
  const out = blank();
  for (const c of COLLS) {
    const ids = new Set([...Object.keys(a[c]), ...Object.keys(b[c]), ...Object.keys(a.tomb[c]), ...Object.keys(b.tomb[c])]);
    for (const id of ids) {
      const opts = [];
      if (a[c][id]) opts.push({ u: +a[c][id].u || 0, rec: a[c][id] });
      if (b[c][id]) opts.push({ u: +b[c][id].u || 0, rec: b[c][id] });
      if (a.tomb[c][id]) opts.push({ u: +a.tomb[c][id], del: true });
      if (b.tomb[c][id]) opts.push({ u: +b.tomb[c][id], del: true });
      opts.sort((x, y) => (y.u - x.u) || ((y.del ? 1 : 0) - (x.del ? 1 : 0)));
      const w = opts[0];
      if (w.del) out.tomb[c][id] = w.u; else out[c][id] = clone(w.rec);
    }
  }
  for (const k of new Set([...META_KEYS, ...Object.keys(a.meta), ...Object.keys(b.meta)])) {
    const ua = +a.mu[k] || 0, ub = +b.mu[k] || 0;
    const src = ub > ua ? b : a;
    out.meta[k] = src.meta[k] === undefined ? (blankMeta()[k] ?? null) : clone(src.meta[k]);
    if (ua || ub) out.mu[k] = Math.max(ua, ub);
  }
  return normalize(out);
}
let S = blank();
try { const raw = localStorage.getItem(LS); if (raw) S = normalize(JSON.parse(raw)); } catch (e) {}
let storageOk = true;
function persist() { try { localStorage.setItem(LS, JSON.stringify(S)); storageOk = true; } catch (e) { if (storageOk) toast('Este navegador no está guardando tus datos'); storageOk = false; } }
function save() { persist(); cloud.dirty = true; clearTimeout(cloud.timer); cloud.timer = setTimeout(syncNow, 600); }

function put(coll, id, obj) {
  const c = strip(obj); c.u = Date.now();
  S[coll][id] = c; delete S.tomb[coll][id];
  save(); refresh();
}
function del(coll, id) {
  delete S[coll][id]; S.tomb[coll][id] = Date.now();
  save(); refresh();
}
function setMeta(key, val) {
  S.meta[key] = val == null ? null : clone(val);
  S.mu[key] = Date.now();
  save(); refresh();
}

/* ---------- nube (Supabase, el mismo proyecto de Fibra y Trazo) ---------- */
const CFG = window.ATRIL_CONFIG || {};
const cloud = { sb: null, session: null, busy: false, again: false, dirty: false, timer: null, state: 'local' };
const SYNC_TXT = { local: 'Solo en este aparato', nologin: 'Sin iniciar sesión: solo en este aparato', syncing: 'Sincronizando…', ok: 'Guardado en tu cuenta', offline: 'Sin internet: se sube cuando vuelva', error: 'No se pudo guardar en la nube' };
const cloudReady = () => !!(cloud.sb && cloud.session);
const netDown = (err) => navigator.onLine === false || /fetch|network|load failed/i.test(String((err && err.message) || err || ''));
const dotClass = () => cloud.state === 'ok' ? '' : cloud.state === 'syncing' ? 'connecting' : 'local';
function syncNoteHtml() {
  const s = cloud.state;
  if (s === 'nologin') return '<button class="syncnote" data-act="acct">Entra con tu cuenta de Fibra para que la tablet y el celular vean lo mismo.</button>';
  if (s === 'offline') return '<p class="syncnote">Sin internet: lo que registres queda en este aparato y se sube cuando vuelva.</p>';
  if (s === 'error') return '<button class="syncnote" data-act="acct">No se pudo guardar en la nube. Toca para revisar.</button>';
  if (s === 'local') return '<p class="syncnote">Solo en este aparato: no se pudo conectar con la nube.</p>';
  return '';
}
function paintSync() {
  const d = $('sync-dot'); if (d) d.className = 'dot ' + dotClass();
  const b = $('sync-btn'); if (b) { b.title = SYNC_TXT[cloud.state]; b.setAttribute('aria-label', 'Cuenta y nube: ' + SYNC_TXT[cloud.state]); }
  const n = $('syncnote'); if (n) n.innerHTML = syncNoteHtml();
  document.querySelectorAll('[data-sync]').forEach((el) => { el.textContent = SYNC_TXT[cloud.state]; });
}
function setSync(k) { cloud.state = k; paintSync(); }

/* Trae lo de la nube, lo junta con lo de este aparato y sube el resultado si cambió algo. */
async function syncNow() {
  clearTimeout(cloud.timer);
  if (!cloudReady()) { setSync(cloud.sb ? 'nologin' : 'local'); return; }
  if (cloud.busy) { cloud.again = true; return; }
  cloud.busy = true; cloud.dirty = false;
  if (cloud.state !== 'ok') setSync('syncing');
  const user = cloud.session.user.id;
  try {
    const r = await cloud.sb.from('atril_state').select('data').eq('user_id', user).maybeSingle();
    if (r.error) throw r.error;
    const remote = r.data && r.data.data ? normalize(r.data.data) : null;
    const merged = remote ? mergeStates(S, remote) : normalize(S);
    if (stable(merged) !== stable(S)) { S = merged; persist(); refresh(); }
    if (!remote || stable(merged) !== stable(remote)) {
      const w = await cloud.sb.from('atril_state').upsert({ user_id: user, data: clone(S), updated_at: new Date().toISOString() });
      if (w.error) throw w.error;
    }
    setSync('ok');
  } catch (e) {
    cloud.dirty = true;
    setSync(netDown(e) ? 'offline' : 'error');
  }
  cloud.busy = false;
  if (cloud.again) { cloud.again = false; syncNow(); }
}
async function initCloud() {
  const make = window.supabase && window.supabase.createClient;
  if (!CFG.url || !CFG.key || !make) { setSync('local'); return; }
  try {
    cloud.sb = make(CFG.url, CFG.key, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storageKey: 'atril-auth' } });
    const { data } = await cloud.sb.auth.getSession(); cloud.session = (data && data.session) || null;
    cloud.sb.auth.onAuthStateChange((ev, s) => {
      cloud.session = s || null;
      if (ev === 'SIGNED_IN') setTimeout(syncNow, 0);
      if (ev === 'SIGNED_OUT') setTimeout(() => { setSync('nologin'); renderAcct(); }, 0);
    });
    if (cloud.session) await syncNow(); else setSync('nologin');
  } catch (e) { cloud.sb = null; cloud.session = null; setSync('local'); }
}
function authErr(e) {
  const m = String((e && e.message) || '').toLowerCase();
  if (m.includes('invalid login')) return 'Correo o contraseña incorrectos. Es la misma cuenta de Fibra y Trazo.';
  if (m.includes('not confirmed')) return 'Falta confirmar el correo: abre el enlace que te llegó y vuelve a intentar.';
  if (navigator.onLine === false || /fetch|network/.test(m)) return 'Sin internet. Intenta cuando tengas conexión.';
  return 'No se pudo entrar. Intenta de nuevo.';
}
window.addEventListener('online', () => { if (cloudReady()) syncNow(); });
window.addEventListener('offline', () => { if (cloudReady()) setSync('offline'); });
setInterval(() => { if (document.visibilityState === 'visible' && cloudReady() && !cloud.busy) syncNow(); }, 20000);

/* ---------- datos derivados ---------- */
const sessList = () => Object.entries(S.sessions).map(([id, v]) => Object.assign({ id }, v));
const pieceList = () => Object.entries(S.pieces).map(([id, v]) => Object.assign({ id }, v));
function sessItems(s) {
  if (Array.isArray(s.items)) return s.items;
  const out = (s.pieces || []).map((id) => ({ t: 'piece', id }));
  for (const t of (s.tags || [])) if (t === 'piano' || t === 'armonia') out.push({ t: 'course', id: t });
  return out;
}
function minutesByDay() { const m = {}; for (const s of sessList()) m[s.day] = (m[s.day] || 0) + (+s.minutes || 0); return m; }
function lastTouched() {
  const m = {};
  for (const s of sessList()) for (const it of sessItems(s)) { const k = it.t + ':' + it.id; if (!m[k] || s.day > m[k]) m[k] = s.day; }
  return m;
}
const pendingOf = (p) => (p.todos || []).filter((t) => !t.done);
function itemName(t, id) { return t === 'course' ? courseName(id) : (S.pieces[id] ? S.pieces[id].title : 'Pieza borrada'); }
function itemLink(t, id) { return safeUrl(t === 'course' ? (S.meta.courses[id] || {}).link : (S.pieces[id] || {}).link); }
function meetSoon() { const n = S.meta.group.next, tk = todayKey(); return n && n >= tk && daysBetween(tk, n) <= 7 ? n : null; }
function meetText(n) { const d = daysBetween(todayKey(), n); return d === 0 ? 'hoy' : d === 1 ? 'mañana' : 'el ' + fmt(fromKey(n), { weekday: 'long', day: 'numeric' }); }

/* Lo más olvidado primero; si el encuentro está cerca, lo pendiente del grupo va adelante */
function candidates() {
  const tk = todayKey(), lt = lastTouched(), soon = meetSoon(), out = [];
  const why = (last, fallbackDays) => {
    if (!last) return { days: fallbackDays, text: 'Todavía no la registras' };
    const d = daysBetween(last, tk);
    return { days: d, text: d <= 0 ? 'La tocaste hoy' : d === 1 ? 'La tocaste ayer' : 'Hace ' + d + ' días no la tocas' };
  };
  for (const p of pieceList()) {
    if (p.state === 'sale') continue;
    const created = p.at ? dkey(new Date(p.at)) : tk;
    const w = why(lt['piece:' + p.id], Math.max(2, daysBetween(created, tk) + 2));
    const pend = pendingOf(p).length;
    let score = w.days, text = w.text;
    if (p.group && soon && pend) { score += 100; text = 'Se ven ' + meetText(soon) + ' · ' + pend + (pend === 1 ? ' pendiente' : ' pendientes'); }
    out.push({ t: 'piece', id: p.id, score, why: text });
  }
  for (const c of COURSES) {
    const w = why(lt['course:' + c.k], 1);
    out.push({ t: 'course', id: c.k, score: w.days - 0.5, why: w.text.replace('la tocas', 'lo abres').replace('La tocaste', 'Lo viste').replace('Todavía no la registras', 'Todavía no lo registras') });
  }
  return out.sort((a, b) => b.score - a.score);
}

function elapsed(a) { if (!a) return 0; return (a.acc || 0) + (a.running ? Math.max(0, Date.now() - a.start) : 0); }
function clockText(ms) { const t = Math.max(0, Math.floor(ms / 1000)); const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60; return h ? h + ':' + pad(m) + ':' + pad(s) : pad(m) + ':' + pad(s); }

/* ---------- íconos y figuras ---------- */
function hashKind(k) { let h = 7; for (const c of k) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h % 4; }
function fig(kind) {
  const o = '<svg aria-hidden="true" viewBox="0 0 42 66" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">';
  const head = (x) => '<path d="M' + x + ' 49 c-6 6 4 12 10 6 c5 -5 -2 -12 -10 -6 z" fill="currentColor" stroke-width="1.5"/>';
  if (kind === 'rest') return o + '<path d="M16 20 l7 8 l-6 7 l7 8 c-6 -2 -9 1 -5 7"/></svg>';
  if (kind === 'today') return o + '<circle cx="21" cy="36" r="17" stroke-width="2" stroke-dasharray="4 5"/></svg>';
  if (kind === 0) return o + head(13) + '<path d="M23 52 L24 12"/></svg>';
  if (kind === 1) return o + head(13) + '<path d="M23 52 L24 12 c3 8 12 10 8 22"/></svg>';
  if (kind === 2) return o + '<path d="M13 44 L23 54 M23 44 L13 54"/><path d="M23 46 L24 12"/></svg>';
  return o + head(3) + head(23) + '<path d="M13 52 L14 13 L34 11 L33 51"/></svg>';
}
/* Pentagrama a lápiz: líneas un poco onduladas, se estiran al ancho */
const STAFF = '<svg class="lines" aria-hidden="true" viewBox="0 0 700 56" preserveAspectRatio="none" fill="none" stroke="currentColor" stroke-width="1.4">'
  + ['M0 4 C 200 2, 460 7, 700 3', 'M0 16 C 240 18, 480 14, 700 17', 'M0 28 C 190 27, 470 30, 700 28', 'M0 40 C 230 42, 520 38, 700 41', 'M0 52 C 210 51, 480 54, 700 52']
    .map((d) => '<path d="' + d + '" vector-effect="non-scaling-stroke"/>').join('') + '</svg>';
const CHEERS = ['¡Eso! Ya está en tu semana.', '¡Bien ahí! Un rato más en tus manos.', '¡Anotado! Tus dedos te lo agradecen.', '¡Qué bien! Que siga sonando.'];
function celebrate() {
  toast(CHEERS[Math.floor(Math.random() * CHEERS.length)], 2800);
  const box = $('party');
  if (!box || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) return;
  let h = '';
  for (let i = 0; i < 12; i++) h += '<span style="left:' + (6 + Math.random() * 86).toFixed(1) + '%;animation-delay:' + (Math.random() * .5).toFixed(2) + 's;--r:' + Math.round(Math.random() * 60 - 30) + 'deg">' + fig(i % 4) + '</span>';
  box.innerHTML = h; clearTimeout(celebrate.t); celebrate.t = setTimeout(() => { box.innerHTML = ''; }, 2700);
}
const I = {
  play: '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a.8.8 0 0 0 1.2.7l10.3-6.5a.8.8 0 0 0 0-1.4L9.2 4.8A.8.8 0 0 0 8 5.5z"/></svg>',
  chev: '<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  back: '<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>',
  close: '<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  shuffle: '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>',
  link: '<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>',
  plus: '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>'
};

/* ---------- vistas ---------- */
const ROUTES = ['hoy', 'repertorio', 'cursos', 'semana'];
let route = 'hoy', sugIdx = 0, repTab = 'mias', confirmSess = null;
function readRoute() { const h = location.hash.slice(1); route = ROUTES.includes(h) ? h : 'hoy'; }

function weekBlock() {
  const tk = todayKey(), mon = monday(new Date()), m = minutesByDay();
  let days = 0, total = 0; const cells = [], names = [], played = [];
  const full = ['lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado', 'domingo'];
  for (let i = 0; i < 7; i++) {
    const k = dkey(addDays(mon, i)), min = m[k] || 0; let inner = '';
    if (min > 0) { days++; total += min; played.push(full[i]); inner = '<span class="fig-on">' + fig(hashKind(k)) + '</span><span class="min">' + min + '′</span>'; }
    else if (k < tk) inner = '<span class="fig-rest">' + fig('rest') + '</span>';
    else if (k === tk) inner = '<span class="fig-today">' + fig('today') + '</span><span class="min today">hoy</span>';
    cells.push('<div class="cell">' + inner + '</div>');
    names.push('<span' + (k === tk ? ' class="today"' : '') + '>' + DAYS[i] + '</span>');
  }
  const aria = played.length ? 'Esta semana tocaste ' + played.join(', ') : 'Esta semana todavía no hay práctica registrada';
  return '<section class="week"><div class="week-head"><span class="sec-title">tu semana</span><span class="week-tot"><b>' + days + '</b> ' + (days === 1 ? 'día' : 'días') + ' · <b>' + total + '</b> min</span></div>'
    + '<div class="staff" role="img" aria-label="' + esc(aria) + '">' + STAFF + '<div class="cells">' + cells.join('') + '</div></div>'

/* "vas en el compás [32]": la cifra va encerrada en un círculo de lápiz */
function posParts(t, id) {
  if (t === 'course') {
    const c = S.meta.courses[id] || {};
    if (!c.lesson && !c.song) return null;
    if (!c.lesson) return { pre: 'vas en', val: c.song };
    return /^\d+$/.test(c.lesson) ? { pre: 'vas en el vídeo', val: c.lesson, after: c.song } : { pre: 'vas en', val: c.lesson, after: c.song };
  }
  const p = S.pieces[id]; if (!p || !p.pos) return null;
  return { pre: p.track === 'tiempo' ? 'vas en el minuto' : 'vas en el compás', val: p.pos };
}
const CIRCLE = '<svg aria-hidden="true" viewBox="0 0 64 50" preserveAspectRatio="none"><path d="M8 26 C 6 10, 50 4, 58 22 C 64 40, 18 48, 6 32 C 2 24, 14 14, 30 12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>';
function whereHtml(t, id) {
  const pp = posParts(t, id);
  if (!pp) return '<span class="where muted">' + (t === 'course' ? 'Aún no anotas en qué vídeo vas' : 'Aún no anotas dónde vas') + '</span>';
  const val = String(pp.val);
  const v = val.length <= 7 ? '<span class="circled">' + esc(val) + CIRCLE + '</span>' : '<b>' + esc(val) + '</b>';
  return '<span class="where"><span>' + esc(pp.pre) + '</span>' + v + (pp.after ? '<span class="muted">· ' + esc(pp.after) + '</span>' : '') + '</span>';
}
function shortPos(t, id) {
  const pp = posParts(t, id);
  if (!pp) return 'sin anotar todavía';
  const lead = t === 'course' ? (/^vas en el vídeo/.test(pp.pre) ? 'vídeo ' : '') : (pp.pre.endsWith('minuto') ? 'minuto ' : 'compás ');
  return lead + pp.val + (pp.after ? ' · ' + pp.after : '');
}
function postitPend(p) {
  const pend = pendingOf(p || {});
  if (!pend.length) return '';
  return '<p class="postit"><small>falta:</small>' + esc(pend[0].text) + (pend.length > 1 ? ' <small style="display:inline">(+' + (pend.length - 1) + ')</small>' : '') + '</p>';
}

function viewSemana() {
  const goal = S.meta.settings.goal || 10;
  const list = sessList().sort((a, b) => (a.day < b.day ? 1 : a.day > b.day ? -1 : (b.at || 0) - (a.at || 0)));
  const byWeek = new Map();
  for (const s of list) { const w = dkey(monday(fromKey(s.day))); if (!byWeek.has(w)) byWeek.set(w, []); byWeek.get(w).push(s); }
  const cur = dkey(monday(new Date())); if (!byWeek.has(cur)) byWeek.set(cur, []);
  const weeks = [...byWeek.keys()].sort().reverse().slice(0, 12);
  const html = weeks.map((w) => {
    const ss = byWeek.get(w), mon = fromKey(w), sun = addDays(mon, 6);
    const dset = new Set(ss.map((s) => s.day)), tot = ss.reduce((n, s) => n + (+s.minutes || 0), 0);
    const rows = ss.map((s) => {
      const parts = sessItems(s).map((it) => '<span>' + esc(itemName(it.t, it.id)) + (it.pos ? ' <span class="muted">· ' + (it.t === 'course' ? 'vídeo ' : (S.pieces[it.id] || {}).track === 'tiempo' ? 'min ' : 'compás ') + esc(it.pos) + '</span>' : '') + (it.song ? ' <span class="muted">· ' + esc(it.song) + '</span>' : '') + '</span>');

      if (extra.length) parts.push('<span class="muted">' + extra.join(' · ') + '</span>');
      if (s.note) parts.push('<span class="note">“' + esc(s.note) + '”</span>');
      const d = fromKey(s.day);
      return '<div class="sess"><div class="l1"><span class="m">' + s.minutes + ' min</span><span class="d">' + fmt(d, { weekday: 'long', day: 'numeric' }) + '</span></div>'
        + (confirmSess === s.id ? '' : '<button class="x" data-act="sdel-ask" data-id="' + esc(s.id) + '" aria-label="Borrar registro">' + I.close + '</button>')
        + '<div class="body">' + (parts.length ? parts.join('') : '<span class="muted">Libre</span>') + '</div>'
        + (confirmSess === s.id ? '<div class="confirm">¿Borrar este registro? <button class="btn sm danger" data-act="sdel-yes" data-id="' + esc(s.id) + '">Borrar</button><button class="btn sm" data-act="sdel-no">Cancelar</button></div>' : '')

    return '<section class="wk"><div class="wk-head"><h3>' + (w === cur ? 'esta semana' : fmt(mon, { day: 'numeric', month: 'short' }) + ' – ' + fmt(sun, { day: 'numeric', month: 'short' })) + '</h3><span class="muted">' + dset.size + (dset.size === 1 ? ' día' : ' días') + ' · ' + tot + ' min</span></div>'
      + (rows ? '<div class="paper">' + rows + '</div>' : '<p class="plain-empty">Esta semana todavía está en blanco. Cualquier rato cuenta.</p>') + '</section>';
  }).join('');
  return '<div class="narrow"><header class="page-head"><h1 class="page-title">Semana</h1><p class="muted">Solo lo que sí tocaste.</p></header>'
    + '<section class="section"><span class="eyebrow">tu rato diario</span><div class="chips">' + [5, 10, 15, 20, 30].map((g) => '<button class="chip sm" data-act="goal" data-v="' + g + '" aria-pressed="' + (goal === g) + '">' + g + ' min</button>').join('') + '</div></section>'

    + '</div>';
}

let pendingRender = false;
const typingIn = (root) => { const a = document.activeElement; return a && root.contains(a) && /^(INPUT|TEXTAREA)$/.test(a.tagName) && a.type !== 'checkbox'; };

/* ---------- capas y botón atrás (Android) ----------
   Cada hoja abierta suma una entrada al historial; el botón atrás del sistema cierra la de arriba en vez de salir de la app. */
const layers = []; let skipPop = 0; const popWaiters = [];
function pushLayer(id) { layers.push(id); try { history.pushState({ atril: layers.length }, ''); } catch (e) {} }
function popLayer(id) { const i = layers.lastIndexOf(id); if (i < 0) return; layers.splice(i, 1); skipPop++; history.back(); }
/* Espera a que el historial termine de cerrar las hojas antes de cambiar de sección */
function afterPops(fn) { if (!skipPop) fn(); else popWaiters.push(fn); }
window.addEventListener('popstate', () => {
  if (skipPop) { skipPop--; if (!skipPop) popWaiters.splice(0).forEach((f) => f()); return; }
  const id = layers.pop(); if (!id) return;
  if (id === 'session') { closeSession(true); render(); }
  else if (id === 'reg') { const ft = R && R.fromTimer; closeReg(true); if (ft && S.meta.active) openSession(); }
  else if (id === 'piece') closePiece(true);
  else if (id === 'acct') closeAcct(true);
});

/* ---------- sesión ---------- */
let tick = null, askDiscard = false, wl = null;
async function wake() { try { if (navigator.wakeLock) wl = await navigator.wakeLock.request('screen'); } catch (e) { wl = null; } }
function unwake() { try { if (wl) wl.release(); } catch (e) {} wl = null; }
function startSession(focus) {
  if (!S.meta.active) setMeta('active', { start: Date.now(), acc: 0, running: true, focus: focus || null });
  askDiscard = false; openSession();
}
/* reuse: la hoja reemplaza a otra que se acaba de cerrar sin tocar el historial (evita carreras entre back() y pushState) */
function takeLayer(from) { const i = layers.lastIndexOf(from); if (i < 0) return false; layers.splice(i, 1); return true; }
function openSession(reuse) {
  if ($('ov-session').hidden) { $('ov-session').hidden = false; if (reuse) layers.push('session'); else pushLayer('session'); }
  lockBody(); renderSession(); clearInterval(tick); tick = setInterval(paintSession, 1000); wake(); $('ov-session').scrollTop = 0;
}
function closeSession(fromPop) {
  if ($('ov-session').hidden) return;
  $('ov-session').hidden = true; clearInterval(tick); tick = null; unwake(); lockBody();
  if (!fromPop) popLayer('session');
}
function renderSession() {

      + (link ? '<a class="textbtn" style="align-self:flex-start;display:inline-flex;align-items:center;gap:6px;text-decoration:none;padding:0" href="' + esc(link) + '" target="_blank" rel="noopener noreferrer">' + I.link + 'Abrir ' + (f.t === 'course' ? 'el curso' : 'partitura o vídeo') + '</a>' : '')

    + '<div class="ov-top"><button class="backbtn" data-act="minimize">' + I.back + 'Inicio</button><button class="x" data-act="discard-ask" aria-label="Descartar sesión">' + I.close + '</button></div>'
    + (askDiscard ? '<div class="confirm" style="justify-content:flex-end">¿Descartar este rato sin guardarlo? <button class="btn sm danger" data-act="discard-yes">Descartar</button><button class="btn sm" data-act="discard-no">Seguir</button></div>' : '')
    + '<div class="clock"><div class="time" id="clock-time">' + clockText(elapsed(a)) + '</div><div class="muted" id="clock-sub">' + (a.running ? 'cualquier tiempo cuenta' : 'en pausa') + '</div>'
    + '<button class="ghost" style="margin-top:12px" data-act="' + (a.running ? 'pause' : 'resume') + '" id="clock-btn">' + (a.running ? 'Pausar' : 'Seguir') + '</button></div>'
    + (card || '<section class="focus-card paper tape"><span class="eyebrow">tocando libre…</span><p class="muted">Al terminar eliges qué tocaste.</p></section>')
    + '<div class="spacer"><button class="wood" data-act="finish">Terminar</button></div></div>';

/* ---------- registro corto ---------- */
let R = null;
const ikey = (it) => it.t + ':' + it.id;
function curPos(it) { return it.t === 'course' ? ((S.meta.courses[it.id] || {}).lesson || '') : ((S.pieces[it.id] || {}).pos || ''); }
function openReg(o, reuse) {
  const items = o.focus ? [o.focus] : [];
  R = { minutes: o.minutes || '', fromTimer: !!o.fromTimer, adjust: !o.fromTimer, day: 'hoy', other: '', items, pos: {}, song: {}, track: {}, done: {},
    picker: !items.length, more: false, extra: [], note: '', adding: false, newTitle: '', newGroup: false, err: '' };
  for (const it of items) seedItem(it);
  if ($('ov-reg').hidden) { $('ov-reg').hidden = false; if (reuse) layers.push('reg'); else pushLayer('reg'); }
  lockBody(); renderReg(); $('ov-reg').scrollTop = 0;
}
function seedItem(it) {
  const k = ikey(it); R.pos[k] = curPos(it);
  if (it.t === 'course') R.song[k] = (S.meta.courses[it.id] || {}).song || '';
  if (it.t === 'piece') { const p = S.pieces[it.id] || {}; R.track[k] = p.track || 'compas'; R.done[k] = {}; }
}
function closeReg(fromPop) {
  if ($('ov-reg').hidden) return;
  $('ov-reg').hidden = true; R = null; lockBody();
  if (!fromPop) popLayer('reg');
}
function posField(it) {
  const k = ikey(it), id = 'rp-' + k.replace(':', '-');
  if (it.t === 'course') return '<label class="field" for="' + id + '">Vídeo en el que quedaste<input type="text" id="' + id + '" data-pos="' + esc(k) + '" placeholder="Ej. 12" value="' + esc(R.pos[k]) + '"></label>'

function saveReg() {
  const min = Math.round(+R.minutes);
  if (!(min >= 1)) { R.err = 'Escribe cuántos minutos tocaste.'; R.adjust = true; renderReg(); return; }
  let day = todayKey();
  if (!R.fromTimer) { if (R.day === 'ayer') day = dkey(addDays(new Date(), -1)); else if (R.day === 'otro') { if (!R.other) { R.err = 'Elige el día en que tocaste.'; renderReg(); return; } day = R.other; } }
  const tags = new Set(R.extra), items = [];
  const courses = clone(S.meta.courses); let coursesChanged = false;
  for (const it of R.items) {
    const k = ikey(it), pos = String(R.pos[k] || '').trim();
    const song = it.t === 'course' ? String(R.song[k] || '').trim() : '';
    const rec = { t: it.t, id: it.id }; if (pos) rec.pos = pos; if (song) rec.song = song;
    items.push(rec);
    if (it.t === 'course') {
      tags.add(it.id);
      const cur = courses[it.id] || {};
      if ((pos && pos !== (cur.lesson || '')) || (song && song !== (cur.song || ''))) {
        courses[it.id] = Object.assign({}, cur, pos ? { lesson: pos } : {}, song ? { song } : {}, { at: Date.now() }); coursesChanged = true;
      }
    } else {
      const p = S.pieces[it.id]; if (!p) continue;
      tags.add(p.group ? 'grupo' : 'mias');
      const doneIds = Object.keys(R.done[k] || {}).filter((x) => R.done[k][x]);
      const np = Object.assign({}, p, { track: R.track[k] || p.track || 'compas' });
      if (pos) np.pos = pos;
      if (doneIds.length) np.todos = (p.todos || []).map((t) => doneIds.includes(t.id) ? Object.assign({}, t, { done: true }) : t);
      if (stable(strip(np)) !== stable(strip(p))) put('pieces', it.id, np);
    }
  }
  const s = { day, minutes: min, items, tags: [...tags], note: R.note.trim(), at: Date.now(), timer: R.fromTimer };
  const wasTimer = R.fromTimer;
  closeReg();
  put('sessions', uid(), s);
  if (coursesChanged) setMeta('courses', courses);
  if (wasTimer) { setMeta('active', null); closeSession(); }
  sugIdx = 0; route = 'hoy'; render(); window.scrollTo(0, 0);
  afterPops(() => { if (location.hash !== '#hoy') location.hash = '#hoy'; });
  celebrate();
}

async function doLogin() {
  if (!A || A.busy || !cloud.sb) return;
  const ei = $('a-email'), pi = $('a-pass');
  A.email = ei ? ei.value.trim() : ''; A.pass = pi ? pi.value : '';
  if (!A.email || !A.pass) { A.err = 'Escribe tu correo y tu contraseña.'; renderAcct(); return; }
  A.busy = true; A.err = ''; renderAcct();
  try {
    const r = await cloud.sb.auth.signInWithPassword({ email: A.email, password: A.pass });
    if (r.error) { if (A) { A.busy = false; A.err = authErr(r.error); renderAcct(); } return; }
    cloud.session = r.data.session;
    closeAcct(); render();
    toast('Listo. Ahora Atril se guarda en tu cuenta');
    syncNow();
  } catch (e) {
    if (A) { A.busy = false; A.err = authErr(e); renderAcct(); }
  }
}

/* ---------- toast ---------- */
let toastT = null;
function toast(msg, ms) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), ms || 2400); }

/* ---------- eventos ---------- */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id, v = el.dataset.v, k = el.dataset.k;
  switch (act) {
    case 'go': if (S.meta.active) openSession(); else startSession({ t: el.dataset.t, id }); break;
    case 'free': startSession(null); break;
    case 'resume-ov': openSession(); break;
    case 'manual': openReg({}); break;
    case 'other': sugIdx++; render(); break;
    case 'goto-cursos': location.hash = '#cursos'; break;
    case 'to-group': repTab = 'grupo'; break;
    case 'new-piece': openPiece(null); break;
    case 'open-piece': openPiece(id); break;
    case 'rep-tab': repTab = v; render(); break;
    case 'minimize': closeSession(); render(); break;
    case 'pause': { const a = S.meta.active; if (a) setMeta('active', Object.assign({}, a, { acc: elapsed(a), running: false })); paintSession(); break; }
    case 'resume': { const a = S.meta.active; if (a) setMeta('active', Object.assign({}, a, { start: Date.now(), running: true })); paintSession(); break; }
    case 'discard-ask': askDiscard = true; renderSession(); break;
    case 'discard-no': askDiscard = false; renderSession(); break;
    case 'discard-yes': askDiscard = false; setMeta('active', null); closeSession(); render(); toast('Descartado. No pasa nada.'); break;
    case 'finish': { const a = S.meta.active; const mins = Math.max(1, Math.round(elapsed(a) / 60000)); const reuse = takeLayer('session'); closeSession(true); openReg({ minutes: mins, fromTimer: true, focus: a && a.focus }, reuse); break; }
    case 'reg-back': { const ft = R && R.fromTimer; if (ft && S.meta.active) { const reuse = takeLayer('reg'); closeReg(true); openSession(reuse); } else closeReg(); break; }
    case 'reg-adjust': R.adjust = true; renderReg(); setTimeout(() => { const i = $('r-min'); if (i) i.focus(); }, 0); break;
    case 'reg-min': R.minutes = +v; R.err = ''; renderReg(); break;
    case 'reg-day': R.day = v; R.err = ''; renderReg(); break;
    case 'reg-track': R.track[k] = v; renderReg(); break;
    case 'reg-rm': R.items = R.items.filter((it) => ikey(it) !== k); if (!R.items.length) R.picker = true; renderReg(); break;
    case 'reg-add': { const it = { t: el.dataset.t, id }; R.items.push(it); seedItem(it); renderReg(); break; }
    case 'reg-picker': R.picker = true; renderReg(); break;
    case 'reg-more': R.more = true; renderReg(); break;
    case 'reg-extra': R.extra = R.extra.includes(v) ? R.extra.filter((x) => x !== v) : R.extra.concat(v); renderReg(); break;
    case 'reg-new': R.adding = true; renderReg(); setTimeout(() => { const i = $('r-np'); if (i) i.focus(); }, 0); break;
    case 'reg-addpiece': {
      const title = R.newTitle.trim(); if (!title) { const i = $('r-np'); if (i) i.focus(); break; }
      const nid = uid(); put('pieces', nid, { title, group: R.newGroup, state: 'aprendiendo', track: 'compas', at: Date.now() });
      const it = { t: 'piece', id: nid }; R.items.push(it); seedItem(it); R.adding = false; R.newTitle = ''; R.newGroup = false; renderReg(); break;
    }
    case 'reg-save': saveReg(); break;
    case 'p-close': closePiece(); break;
    case 'p-group': P.group = v === '1'; renderPiece(); break;
    case 'p-state': P.state = v; renderPiece(); break;
    case 'p-track': P.track = v; renderPiece(); break;
    case 'p-todo-add': if (P.newTodo.trim()) { P.todos.push({ id: uid(), text: P.newTodo.trim(), done: false }); P.newTodo = ''; renderPiece(); setTimeout(() => { const i = $('p-newtodo'); if (i) i.focus(); }, 0); } break;
    case 'p-todo-rm': P.todos = P.todos.filter((t) => t.id !== id); renderPiece(); break;
    case 'p-save': savePiece(false); break;
    case 'p-play': if (S.meta.active) { toast('Ya tienes una sesión abierta'); break; } savePiece(true); break;
    case 'p-del': P.confirm = true; renderPiece(); break;
    case 'p-del-no': P.confirm = false; renderPiece(); break;
    case 'p-del-yes': { const pid = P.id; closePiece(); del('pieces', pid); toast('Pieza borrada'); break; }
    case 'goal': setMeta('settings', Object.assign({}, S.meta.settings, { goal: +v })); break;
    case 'sdel-ask': confirmSess = id; render(); break;
    case 'sdel-no': confirmSess = null; render(); break;
    case 'sdel-yes': confirmSess = null; del('sessions', id); toast('Registro borrado'); break;
    case 'acct': openAcct(); break;
    case 'acct-close': closeAcct(); break;
    case 'acct-sync': syncNow().then(() => toast(cloud.state === 'ok' ? 'Al día' : SYNC_TXT[cloud.state])); break;
    case 'acct-out': A.confirmOut = true; renderAcct(); break;
    case 'acct-out-no': A.confirmOut = false; renderAcct(); break;
    case 'acct-out-yes': if (cloud.sb) cloud.sb.auth.signOut().catch(() => {}); cloud.session = null; setSync('nologin'); closeAcct(); render(); toast('Sesión cerrada'); break;
  }
});

    if (t.id === 'r-date') { R.other = t.value; return; }
    if (t.id === 'r-np') { R.newTitle = t.value; return; }
    if (t.id === 'r-note') { R.note = t.value; return; }
    if (t.dataset.pos) { R.pos[t.dataset.pos] = t.value; return; }
    if (t.dataset.song) { R.song[t.dataset.song] = t.value; return; }
  }
  if (P) {
    const map = { 'p-title': 'title', 'p-pos': 'pos', 'p-link': 'link', 'p-note': 'note', 'p-newtodo': 'newTodo' };
    if (map[t.id]) { P[map[t.id]] = t.value; if (t.id === 'p-title') P.err = ''; }
  }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.id === 'p-newtodo') { e.preventDefault(); const b = document.querySelector('[data-act="p-todo-add"]'); if (b) b.click(); }
  if (e.key === 'Enter' && e.target.id === 'r-np') { e.preventDefault(); const b = document.querySelector('[data-act="reg-addpiece"]'); if (b) b.click(); }
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'r-npg' && R) { R.newGroup = t.checked; return; }
  if (t.id === 'r-date' && R) { R.other = t.value; return; }
  if (t.dataset.rdone && R) { const [k, tid] = t.dataset.rdone.split('|'); R.done[k][tid] = t.checked; t.closest('.check').classList.toggle('done', t.checked); return; }
  if (t.dataset.ptodo && P) { const td = P.todos.find((x) => x.id === t.dataset.ptodo); if (td) td.done = t.checked; t.closest('.check').classList.toggle('done', t.checked); return; }
  if (t.id === 'g-next') { setMeta('group', Object.assign({}, S.meta.group, { next: t.value })); return; }
  if (t.dataset.course) {
    const k = t.dataset.course, f = t.dataset.f, cur = Object.assign({}, S.meta.courses[k] || {});
    if ((cur[f] || '') === t.value.trim()) return;
    cur[f] = t.value.trim(); if (f === 'lesson') cur.at = Date.now();
    setMeta('courses', Object.assign({}, S.meta.courses, { [k]: cur })); toast('Anotado');
  }
});
document.addEventListener('submit', (e) => { e.preventDefault(); if (e.target.id === 'acct-form') doLogin(); });

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (!$('ov-session').hidden) { paintSession(); wake(); }
  if (!typingIn($('view'))) render();
  if (cloudReady()) syncNow();
});
window.addEventListener('hashchange', () => { readRoute(); confirmSess = null; render(); window.scrollTo(0, 0); });

/* ---------- arranque ---------- */
readRoute();
render();
setInterval(() => { if (route === 'hoy' && S.meta.active && $('ov-session').hidden && !typingIn($('view'))) render(); }, 15000);
initCloud();
if ('serviceWorker' in navigator && location.protocol === 'https:') { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); }); }
</script>
</body>
